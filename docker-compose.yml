services:
  techquiz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techquiz-arena
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/server/data/techquiz.db
      - UPLOADS_DIR=/app/server/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
